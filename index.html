<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レビューでえらぶ 買いものさがし</title>
<meta name="description" content="楽天市場の商品を、レビューの件数と評価、価格、ポイントで絞り込んで探せる個人サイトです。">
<style>
  :root { --bg:#f7f6f3; --card:#fff; --ink:#1f1f1f; --muted:#666; --line:#e4e1db; --accent:#bf0000; --chip:#f1eee8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --card:#222; --ink:#eee; --muted:#aaa; --line:#3a3a3a; --accent:#ff6b6b; --chip:#2c2c2c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.7 -apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .lead { color:var(--muted); margin:0 0 16px; font-size:.95rem; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:.82rem; color:var(--muted); }
  input[type=search], input[type=number], select {
    font:inherit; font-size:.95rem; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input[type=search] { width:100%; }
  .grow { flex:1 1 260px; }
  .num { width:110px; }
  .check { flex-direction:row; align-items:center; gap:6px; font-size:.9rem; color:var(--ink); }
  button { font:inherit; border-radius:8px; padding:9px 18px; cursor:pointer; border:1px solid var(--line);
           background:var(--card); color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { background:var(--chip); border-color:transparent; padding:5px 12px; font-size:.85rem; }
  .status { color:var(--muted); font-size:.9rem; margin:14px 2px; min-height:1.5em; }
  .status.err { color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .item img { width:100%; aspect-ratio:1/1; object-fit:contain; background:#fff; border-radius:8px; }
  .item .name { font-size:.9rem; line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .item .name a { color:inherit; text-decoration:none; }
  .item .name a:hover { text-decoration:underline; }
  .price { font-weight:700; font-size:1.05rem; }
  .meta { font-size:.82rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; }
  .tag { display:inline-block; font-size:.75rem; padding:0 8px; border-radius:999px; background:var(--chip); }
  .more { display:flex; justify-content:center; margin:18px 0; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-top:24px; font-size:.88rem; color:var(--muted); }
  .note p { margin:4px 0; }
  footer { color:var(--muted); font-size:.82rem; margin-top:20px; }
  footer a { color:inherit; }
  @media (max-width:520px) { .grid { grid-template-columns:repeat(2,1fr); } .num { width:96px; } }
</style>
</head>
<body>
<main>
  <h1>レビューでえらぶ 買いものさがし</h1>
  <p class="lead">楽天市場の商品を、レビューの件数と評価、価格、ポイントで絞り込んで探せます。</p>

  <form id="f" autocomplete="off">
    <div class="row">
      <label class="grow">キーワード
        <input type="search" id="q" placeholder="例：ワイドパンツ　収納ラック　ロンT 120">
      </label>
      <label>ジャンル
        <select id="g">
          <option value="">すべて</option>
          <optgroup label="ファッション">
            <option value="100371">レディースファッション</option>
            <option value="551177">メンズファッション</option>
            <option value="111078">キッズファッション</option>
            <option value="100533">キッズ・ベビー・マタニティ</option>
            <option value="216131">バッグ・小物</option>
            <option value="558885">靴</option>
          </optgroup>
          <optgroup label="くらし">
            <option value="100804">インテリア・寝具・収納</option>
            <option value="558944">キッチン用品・食器</option>
            <option value="215783">日用品雑貨・文房具</option>
            <option value="562637">家電</option>
            <option value="100026">パソコン・周辺機器</option>
          </optgroup>
          <optgroup label="趣味・そのほか">
            <option value="101070">スポーツ・アウトドア</option>
            <option value="101164">ホビー</option>
            <option value="566382">おもちゃ</option>
            <option value="101213">ペット用品</option>
            <option value="100939">美容・コスメ</option>
            <option value="100227">食品</option>
          </optgroup>
        </select>
      </label>
      <label>並べ方
        <select id="s">
          <option value="-reviewCount">レビューが多い順</option>
          <option value="-reviewAverage">評価が高い順</option>
          <option value="standard">楽天の標準</option>
          <option value="+itemPrice">安い順</option>
          <option value="-itemPrice">高い順</option>
          <option value="-updateTimestamp">新しい順</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>価格（下限）<input type="number" id="pmin" class="num" min="0" step="100" placeholder="円"></label>
      <label>価格（上限）<input type="number" id="pmax" class="num" min="0" step="100" placeholder="円"></label>
      <label>レビュー件数
        <select id="rc">
          <option value="0">指定なし</option>
          <option value="100">100件以上</option>
          <option value="300">300件以上</option>
          <option value="1000">1,000件以上</option>
        </select>
      </label>
      <label>評価
        <select id="ra">
          <option value="0">指定なし</option>
          <option value="4.0">星4.0以上</option>
          <option value="4.3">星4.3以上</option>
          <option value="4.5">星4.5以上</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="pt">ポイント倍率あり</label>
      <label class="check"><input type="checkbox" id="pf">送料込みだけ</label>
      <button type="submit" class="primary" id="go">さがす</button>
    </div>
    <div class="chips" aria-label="よく使う絞り込み">
      <button type="button" data-preset='{"g":"111078","s":"-reviewCount","rc":"300","ra":"4.3"}'>子ども服　レビュー多め</button>
      <button type="button" data-preset='{"g":"100371","s":"-reviewCount","rc":"300","ra":"4.3","pmin":"2000","pmax":"8000"}'>レディース　2千〜8千円</button>
      <button type="button" data-preset='{"g":"100804","s":"-reviewCount","rc":"1000"}'>家具・収納　定番</button>
      <button type="button" data-preset='{"g":"551177","s":"-reviewAverage","rc":"300"}'>メンズ　評価高め</button>
      <button type="button" data-preset='{"g":"562637","s":"-reviewCount","pt":"1"}'>家電　ポイント付き</button>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="grid" id="list"></div>
  <div class="more"><button type="button" id="more" hidden>もっと見る</button></div>

  <div class="note">
    <p>価格・ポイント・在庫は調べた時点のものです。買う前に商品ページで確かめてください。</p>
    <p>商品へのリンクは楽天市場のページです。このサイトには、楽天アフィリエイトの広告リンクを含む場合があります。</p>
    <p>レビューの件数と評価で絞り込む条件は、楽天から受け取った結果の中から、このページで選んでいます。</p>
  </div>

  <footer>
    運営：個人（DC-fuji）　／　商品情報：<a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">楽天ウェブサービス</a>
  </footer>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
